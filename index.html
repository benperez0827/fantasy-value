'<div class="gnote"><b>How to read this:</b> these are <b>model leans</b>, not odds-derived edges. The engine ranks each spot 0&ndash;100 by the inputs that move that prop (contact quality, matchup vs today&#39;s starter, park, recent form). The <b>Line / Odds / Edge</b> columns show prop lines via <b>SportsGameOdds</b> (FanDuel when available, otherwise market consensus) once an odds key is configured; <b>Edge</b> = model probability &minus; the de-vigged implied probability (positive = model sees value; strikeout edge uses a Poisson model around the posted line). Free-tier lines may be ~10 min delayed. The Hits/TB tab lists odds for <b>1+ hits</b> and <b>2+ total bases</b> &mdash; two different bets &mdash; with an edge beside each (model probabilities are rough estimates: 1+ hits uses the model&#39;s hit probability; 2+ total bases scales it by the batter&#39;s power (SLG)). The <b>Pitcher Props</b> tab covers three starter bets: strikeouts (Over, Poisson around the line &mdash; now adjusted for the <b>opposing lineup&#39;s K%</b> split by the pitcher&#39;s handedness, the lineup&#39;s home/away role, and its last-30-day form), <b>outs recorded</b> (Over, from the model&#39;s projected innings) and <b>earned runs</b> (Under, from expected ERA over projected innings) &mdash; each with its own odds and edge. <b>Ineligible players</b> (IL, bereavement, paternity, or DTD) are excluded from all leans and Top Plays. <b>Limited-role bats</b> (low season plate appearances) are also held out so part-timers don&#39;t surface as plays. <b>Top Plays additionally require an everyday job</b> (&ge;70% of a full-timer&#39;s PA): platoon bats who sit vs same-hand starters or get lifted mid-game stay on the market tabs but are never recommended. Model %/projections are rough estimates, not guarantees. <b>Top Plays</b> are the model&#39;s sweet-spot bets: a strong model lean (&ge;65) AND a positive edge, ranked by a blend of the two and capped at 3 per market. Both overs and unders are considered, but <b>unders only on pitcher props</b> (K/Outs) since FanDuel doesn&#39;t post hitter unders; for an under, &lsquo;conviction&rsquo; is the inverse lean (a pitcher the model strongly fades). Home-run props use a richer power profile (barrels/PA, hard-hit%, exit velo, bat speed, SLG) plus heavy splits weighting &mdash; platoon (vs the starter&#39;s hand), home/away power, ballpark HR-friendliness, and batter-vs-starter history &mdash; and a recalibrated HR-probability curve (convex: elite power ~24-29%, weak ~6-8%) fit so HR edges are no longer systematically negative without inflating weak-hitter longshots. Hit/TB props are likewise calibrated from the backtest: 1+ hit probabilities are deflated (the model was over-confident on favorites, ~80% predicted vs ~67% actual) and 2+ total-base probabilities are boosted (under-rated like HR). All FanDuel-offered markets qualify (earned-run props are excluded since FanDuel doesn&#39;t post them). <b>Top Plays now use FanDuel odds only</b> &mdash; a play is included only when we have FanDuel&#39;s price; if only market consensus is available it&#39;s left out (you can still see it on the market tabs, tagged <b>cons</b>). <b>2026-07-27 recalibration:</b> hitter and HR model probabilities are now also shrunk toward the de-vigged market price (K/Outs already were); Top Plays exclude the mid odds band (-149 to +149, the backtest&#39;s worst-performing prices); Hits/TB and HR picks require a positive blended edge; and pitcher K/Outs plays require a recent-workload check (avg &ge;85 pitches over the last 3 starts, no 15+ day layoff) so post-IL/short-leash starts are never recommended. For entertainment; please bet responsibly.</div>'+

function renderTop(){
  var w=document.getElementById('gTopWrap'); var q=G.q;
  var items=G.top.filter(function(x){return !q||(x.nm+' '+x.tm+' '+x.opp).toLowerCase().indexOf(q)>=0;});
  document.getElementById('gcnt').textContent=items.length+' top plays';
  w.innerHTML=items.map(function(x){
    return '<div class="gcard"><div class="mk">'+x.mk+'</div><div class="pl">'+x.nm+' <span class="tm">'+x.tm+'</span></div>'+
      '<div class="dt2">'+x.opp+' &middot; '+x.det+'</div>'+
      '<div class="ln" style="margin:3px 0 0">'+(x.side||'')+' <b style="color:#0a3d25">'+(x.odds!=null?fmtOdds(x.odds):'&mdash;')+'</b> <span style="font-size:10px;color:#5b6470">'+(x.book==='fanduel'?'FD':'cons')+'</span></div>'+
      '<div class="ln">Lean '+leanBadge(x.lean)+' &nbsp; <b>'+x.est+'</b>'+(x.edge!=null?(' &nbsp; <b style="color:'+(x.edge>=0?'#0d7d4d':'#b3402f')+'">Edge '+(x.edge>0?'+':'')+x.edge.toFixed(1)+'%</b>'):'')+'</div></div>';
  }).join('') || '<div class="muted">No plays for this date.</div>';
}
function renderTable(){
  var cols=COLS[G.market]; var data=(G.market==='hits'?G.hits:G.market==='hr'?G.hr:G.k).slice();
  var q=G.q; if(q) data=data.filter(function(r){return (r.nm+' '+r.tm+' '+r.opp+' '+(r.sp||'')).toLowerCase().indexOf(q)>=0;});
  var sk=G.sort.key, asc=G.sort.asc;
  data.sort(function(a,b){var av=a[sk],bv=b[sk]; if(av==null||isNaN(av))av=-1e9; if(bv==null||isNaN(bv))bv=-1e9; if(typeof a[sk]==='string'){av=(a[sk]||'').toLowerCase();bv=(b[sk]||'').toLowerCase();return asc?(av<bv?-1:av>bv?1:0):(av<bv?1:av>bv?-1:0);} return asc?av-bv:bv-av;});
  var head=document.getElementById('ghead'); var body=document.getElementById('gbody');
  head.innerHTML=cols.map(function(c){var cls=(c.cls||'')+(c.k&&c.k===sk?(asc?' sa':' s'):''); return '<th class="'+cls+'"'+(c.k?' data-k="'+c.k+'"':'')+'>'+c.h+'</th>';}).join('');
  body.innerHTML=data.map(function(r,i){return '<tr>'+cols.map(function(c){return '<td class="'+(c.cls||'')+'">'+c.f(r,i)+'</td>';}).join('')+'</tr>';}).join('');
  document.getElementById('gcnt').textContent=data.length+' players';
  Array.prototype.forEach.call(head.querySelectorAll('th[data-k]'),function(th){th.onclick=function(){var kk=th.getAttribute('data-k'); if(G.sort.key===kk)G.sort.asc=!G.sort.asc; else {G.sort.key=kk;G.sort.asc=false;} renderTable();};});
}
function equitySVG(pts){
  if(!pts.length) return '';
  var w=700,h=120,pad=6; var mn=Math.min(0,Math.min.apply(null,pts)),mx=Math.max(0,Math.max.apply(null,pts));
  var rng=(mx-mn)||1,n=pts.length;
  function X(i){return pad+(n<=1?0:i*(w-2*pad)/(n-1));} function Y(v){return pad+(h-2*pad)*(1-(v-mn)/rng);}
  var d='M'+X(0)+' '+Y(pts[0]); for(var i=1;i<n;i++)d+=' L'+X(i)+' '+Y(pts[i]);
  var col=pts[n-1]>=0?'#0d7d4d':'#b3402f';
  return '<div style="background:#fff;border:1px solid #e1e5ea;border-radius:9px;padding:8px 10px;margin-bottom:12px"><div class="mk" style="color:#42505e;margin-bottom:4px">Cumulative units ('+n+' graded bets)</div><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:120px"><line x1="'+pad+'" y1="'+Y(0)+'" x2="'+(w-pad)+'" y2="'+Y(0)+'" stroke="#cdd3da" stroke-dasharray="3 3"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/></svg></div>';
}
function renderResults(){
  var rw=document.getElementById('gResWrap');
  var P=(typeof RESULTS!=='undefined'&&RESULTS)?RESULTS:[];
  var graded=P.filter(function(p){return p.status==='win'||p.status==='loss';});
  var pend=P.filter(function(p){return p.status==='pending';}).length;
  function stats(list){var w=0,l=0,u=0;list.forEach(function(p){if(p.status==='win')w++;else if(p.status==='loss')l++;u+=(p.units||0);});var n=w+l;return {w:w,l:l,u:u,roi:n?100*u/n:0};}
  function uc(u){return u>=0?'#0d7d4d':'#b3402f';}
  function card(t,st){return '<div class="gcard" style="border-left-color:'+uc(st.u)+'"><div class="mk">'+t+'</div><div class="pl" style="color:'+uc(st.u)+'">'+(st.u>=0?'+':'')+st.u.toFixed(2)+'u</div><div class="dt2">'+st.w+'W&ndash;'+st.l+'L &middot; ROI '+(st.roi>=0?'+':'')+st.roi.toFixed(1)+'%</div></div>';}
  var html='<div class="gnote">Paper backtest &mdash; <b>1 unit flat</b> on every Top Play (the model&#39;s side) at the recorded odds, graded from final MLB box scores. Days before live tracking use closing lines. For evaluation only; not financial advice.</div>';
  html+='<div class="gcards">'+card('All Top Plays',stats(graded))+card('Positive-Edge Only',stats(graded.filter(function(p){return p.edge!=null&&p.edge>0;})));
  ['Hits / TB','Total Bases','Home Run','Pitcher K','Pitcher Outs','Pitcher ER'].forEach(function(mk){html+=card(mk,stats(graded.filter(function(p){return p.market===mk;})));});
  html+='</div>';
  var seq=graded.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  var cum=0,pts=seq.map(function(p){cum+=(p.units||0);return cum;});
  html+=equitySVG(pts);
  var rows=P.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  html+='<div class="tablewrap" style="max-height:60vh"><table><thead><tr><th class="l">Date</th><th class="l">Market</th><th class="name l">Player</th><th class="l">Bet</th><th>Odds</th><th>Edge</th><th>Stat</th><th>Result</th><th>Units</th></tr></thead><tbody>';
  rows.forEach(function(p){var st=p.status; var rc=st==='win'?'#0d7d4d':st==='loss'?'#b3402f':'#9aa3ad'; var ru=p.units==null?'':((p.units>0?'+':'')+(+p.units).toFixed(2)); var rtxt=st==='pending'?'pending':st==='void'?'void':(st==='win'?'WIN':'LOSS'); var ed=(p.edge==null?'':((p.edge>0?'+':'')+p.edge.toFixed(1)+'%'));
    html+='<tr><td class="l">'+p.date.slice(5)+'</td><td class="l">'+p.market+'</td><td class="name l">'+p.player+'</td><td class="l">'+p.side+'</td><td>'+(p.odds!=null?((p.odds>0?'+':'')+p.odds):'')+'</td><td style="color:'+(p.edge>0?'#0d7d4d':'#b3402f')+'">'+ed+'</td><td>'+(p.result==null?'':p.result)+'</td><td style="color:'+rc+';font-weight:700">'+rtxt+'</td><td style="color:'+(p.units>0?'#0d7d4d':(p.units<0?'#b3402f':'#9aa3ad'))+';font-weight:700">'+ru+'</td></tr>';});
  html+='</tbody></table></div>';
  rw.innerHTML=html;
  document.getElementById('gcnt').textContent=graded.length+' graded · '+pend+' pending';
}
function drawMarket(){
  var tw=document.getElementById('gTopWrap'), bw=document.getElementById('gTblWrap'), rw=document.getElementById('gResWrap');
  tw.style.display='none';bw.style.display='none';if(rw)rw.style.display='none';
  if(G.market==='top'){tw.style.display='grid';renderTop();}
  else if(G.market==='results'){if(rw)rw.style.display='block';renderResults();}
  else{bw.style.display='block';renderTable();}
}
function renderGambling(){
  var R=computeAll(); G.hits=R.hits;G.hr=R.hr;G.k=R.k;G.top=R.top;
  var gi=document.getElementById('ginel'); if(gi){var _m=[]; if((R.nIneH+R.nIneP)>0)_m.push((R.nIneH+R.nIneP)+' injured'); if(R.nLowH>0)_m.push(R.nLowH+' limited-role (<'+R.thr+' PA)'); gi.textContent=_m.length?('\u2298 '+_m.join(' + ')+' excluded'):'';}
  var g=document.getElementById('gdt'); if(g)g.textContent=new Date(D.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  drawMarket();
}
function setMode(m){
  var fv=document.getElementById('fvFantasy'),gv=document.getElementById('fvGambling');
  var bf=document.getElementById('mbFV'),bg=document.getElementById('mbGB');
  if(m==='gb'){fv.style.display='none';gv.style.display='block';bf.classList.remove('on');bg.classList.add('on');renderGambling();}
  else{fv.style.display='block';gv.style.display='none';bg.classList.remove('on');bf.classList.add('on');}
}
if(!STANDALONE){
  document.getElementById('mbFV').onclick=function(){setMode('fv');};
  document.getElementById('mbGB').onclick=function(){setMode('gb');};
}

});
document.getElementById('gsearch').oninput=function(){G.q=this.value.toLowerCase();drawMarket();};
if(STANDALONE){ renderGambling(); }
else if(dsel) dsel.addEventListener('change',function(){ if(document.getElementById('fvGambling').style.display!=='none') renderGambling(); });
}catch(e){ if(window.console)console.error('gambling module error',e); }
