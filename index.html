'<div class="gnote"><b>How to read this:</b> these are <b>model leans</b>, not odds-derived edges. The engine ranks each spot 0&ndash;100 by the inputs that move that prop (contact quality, matchup vs today&#39;s starter, park, recent form). The <b>Line / Odds / Edge</b> columns show prop lines via <b>SportsGameOdds</b> (FanDuel when available, otherwise market consensus) once an odds key is configured; <b>Edge</b> = model probability &minus; the de-vigged implied probability (positive = model sees value; strikeout edge uses a Poisson model around the posted line). Free-tier lines may be ~10 min delayed. The Hits/TB tab lists odds for <b>1+ hits</b> and <b>2+ total bases</b> &mdash; two different bets &mdash; with an edge beside each (model probabilities are rough estimates: 1+ hits uses the model&#39;s hit probability; 2+ total bases scales it by the batter&#39;s power (SLG)). The <b>Pitcher Props</b> tab covers three starter bets: strikeouts (Over, Poisson around the line &mdash; now adjusted for the <b>opposing lineup&#39;s K%</b> split by the pitcher&#39;s handedness, the lineup&#39;s home/away role, and its last-30-day form), <b>outs recorded</b> (Over, from the model&#39;s projected innings) and <b>earned runs</b> (Under, from expected ERA over projected innings) &mdash; each with its own odds and edge. <b>Ineligible players</b> (IL, bereavement, paternity, or DTD) are excluded from all leans and Top Plays. <b>Limited-role bats</b> (low season plate appearances) are also held out so part-timers don&#39;t surface as plays. <b>Top Plays additionally require an everyday job</b> (&ge;70% of a full-timer&#39;s PA): platoon bats who sit vs same-hand starters or get lifted mid-game stay on the market tabs but are never recommended. Model %/projections are rough estimates, not guarantees. <b>Top Plays</b> are the model&#39;s sweet-spot bets: a strong model lean (&ge;65) AND a positive edge, ranked by a blend of the two and capped at 3 per market. Both overs and unders function computeAll(){
  var H=(D.hitters||[]); var PL=(D.pitchers||[]);
  var PM={}; PL.forEach(function(p){if(p.name)PM[p.name]=p;});
  var LU=(typeof LINEUPS_BY_DATE!=='undefined'&&LINEUPS_BY_DATE&&LINEUPS_BY_DATE[D.date])?LINEUPS_BY_DATE[D.date]:null;
  var _starters={}; if(LU&&LU.starters)LU.starters.forEach(function(n){_starters[n]=1;});
  function lineupOK(h){ if(!LU||!LU.teams)return true; if(LU.teams.indexOf(h.team)<0)return true; return _starters[normName(h.name)]===1; }
  // ---- playing-time qualifier: drop part-time bats so they can't be recommended ----
  var _pa=H.map(function(h){return num(h.pa);}).filter(function(v){return v!=null&&v>0;}).sort(function(a,b){return a-b;});
  var _p90=_pa.length?_pa[Math.min(_pa.length-1,Math.floor(0.90*_pa.length))]:0;
  var THR=Math.round(0.45*_p90); // ~half a full-timer's PA; self-scales over the season
  function reg(h){return num(h.pa)!=null && h.pa>=THR;}
  // ---- everyday-job qualifier (Top Plays only): platoon bats accrue ~55-65% of a regular's PA,
  // sit vs same-hand starters and get lifted mid-game for pinch hitters -- their per-game PA is
  // unreliable, so they stay visible on the market tabs but can't surface as Top Plays.
  // NOTE: also briefly holds out everyday bats returning from long IL stints until season PA share recovers.
  var EVR=Math.round(0.70*_p90);
  function everyday(h){return num(h.pa)!=null && h.pa>=EVR;}
  // ---- Hits / TB ----
  var pXW=mkPct(H.map(function(h){return num(h.xwoba);}));
  var pSLG=mkPct(H.map(function(h){return num(h.slg);}));
  var pPF=mkPct(H.map(function(h){return num(h.pf);}));
  var pL7=mkPct(H.map(function(h){return num(h.spl7);}));
  var pPlat=mkPct(H.map(function(h){return num(h.spplat);}));
  var pHA=mkPct(H.map(function(h){return num(h.spha);}));
  function oppWeak(h){var sp=PM[h.opp_sp];return (sp&&sp.pq!=null)?(100-sp.pq):null;}

  var hits=[];
  H.forEach(function(h){ if(inel(h))return; if(!reg(h))return; if(!lineupOK(h))return; if(num(h.xwoba)==null)return;
    var lean=blend([[pXW(num(h.xwoba)),.34],[pOpp(oppWeak(h)),.22],[pPlat(num(h.spplat)),.16],[pHA(num(h.spha)),.14],[pPF(num(h.pf)),.08],[pL7(num(h.spl7)),.06]]);
    if(lean==null)return;
    hits.push({nm:h.name,key:normName(h.name),evr:everyday(h)?1:0,tm:h.team,opp:(h.home?'vs ':'@ ')+h.opp,sp:h.opp_sp||'',lean:lean*100,est:0.48+0.22*lean,xw:num(h.xwoba),slg:num(h.slg),l7:num(h.spl7),pf:num(h.pf),bpa:num(h.brlpa),mev:num(h.mev),ow:oppWeak(h),spplat:num(h.spplat),spha:num(h.spha),spbvp:num(h.spbvp),fa:h.avail?1:0});
  });
  hits.sort(function(a,b){return b.lean-a.lean;});
  // ---- Home runs ----
  var pBpa=mkPct(H.map(function(h){return num(h.brlpa);}));
  var pBrl=mkPct(H.map(function(h){return num(h.brl);}));
  var pMev=mkPct(H.map(function(h){return num(h.mev);}));
  var pHH=mkPct(H.map(function(h){return num(h.hh);}));
  var pAEV=mkPct(H.map(function(h){return num(h.aev);}));
  var pBS=mkPct(H.map(function(h){return num(h.bs);}));
  var pBvP=mkPct(H.map(function(h){return num(h.spbvp);}));
  function oppBarrel(h){var sp=PM[h.opp_sp];return (sp&&sp.brl!=null)?num(sp.brl):null;}
  var pOppB=mkPct(H.map(oppBarrel));

  H.forEach(function(h){ if(inel(h))return; if(!reg(h))return; if(!lineupOK(h))return; if(num(h.brlpa)==null&&num(h.brl)==null)return;
    // HR lean: power profile (barrels/PA, hard-hit%, barrel%, maxEV, avgEV, bat speed, SLG) + opp contact-allowed + platoon & home/away splits + park.
    // power profile (.48) + splits (.52): platoon & home/away (heaviest), ballpark (HR-sensitive), batter-vs-pitcher history, opp contact-allowed.
    var lean=blend([[pBpa(num(h.brlpa)),.16],[pHH(num(h.hh)),.08],[pBrl(num(h.brl)),.06],[pMev(num(h.mev)),.05],[pAEV(num(h.aev)),.05],[pBS(num(h.bs)),.04],[pSLG(num(h.slg)),.04],[pPlat(num(h.spplat)),.12],[pHA(num(h.spha)),.12],[pPF(num(h.pf)),.10],[pBvP(num(h.spbvp)),.08],[pOppB(oppBarrel(h)),.10]]);

  var pXera=mkPct(P.map(function(p){return num(p.xera);}));

  var TK=(typeof TEAMK_BY_DATE!=='undefined'&&TEAMK_BY_DATE&&TEAMK_BY_DATE[D.date])?TEAMK_BY_DATE[D.date]:null;
  var _lk=[]; if(TK){for(var _tt in TK){if(TK[_tt]&&TK[_tt].ks!=null)_lk.push(TK[_tt].ks);}}
  var leagueK=_lk.length?(_lk.reduce(function(a,b){return a+b;},0)/_lk.length):22.0;
  function oppAdjK(p){ if(!TK)return null; var t=TK[p.opp]; if(!t)return null;
    var byHand=(p.hand==='L')?t.kvl:t.kvr;          // opponent lineup K% vs this pitcher's handedness
    var bySide=(t.side==='home')?t.kh:t.ka;         // opponent lineup K% in their home/away role today
    var ws=0,acc=0; function add(v,w){if(v!=null){acc+=v*w;ws+=w;}}
    add(byHand,.40); add(bySide,.30); add(t.kl30,.20); add(t.ks,.10);
    return ws>0?acc/ws:null; }
  var _adjK={}; P.forEach(function(p){_adjK[p.name]=oppAdjK(p);});
  var pOppK=mkPct(P.map(function(p){return _adjK[p.name];}));
  var k=[];
  P.forEach(function(p){
    var iXW=pXWa(num(p.xwoba)); iXW=(iXW==null)?null:1-iXW;
    var iOff=pOff(num(p.oppoff)); iOff=(iOff==null)?null:1-iOff;
    var adjK=_adjK[p.name];

function drawMarket(){
  var tw=document.getElementById('gTopWrap'), bw=document.getElementById('gTblWrap'), rw=document.getElementById('gResWrap');
  tw.style.display='none';bw.style.display='none';if(rw)rw.style.display='none';
  if(G.market==='top'){tw.style.display='grid';renderTop();}
  else if(G.market==='results'){if(rw)rw.style.display='block';renderResults();}
  else{bw.style.display='block';renderTable();}
}
function renderGambling(){
  var R=computeAll(); G.hits=R.hits;G.hr=R.hr;G.k=R.k;G.top=R.top;
  var gi=document.getElementById('ginel'); if(gi){var _m=[]; if((R.nIneH+R.nIneP)>0)_m.push((R.nIneH+R.nIneP)+' injured'); if(R.nLowH>0)_m.push(R.nLowH+' limited-role (<'+R.thr+' PA)'); gi.textContent=_m.length?('\u2298 '+_m.join(' + ')+' excluded'):'';}
  var g=document.getElementById('gdt'); if(g)g.textContent=new Date(D.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  drawMarket();
}
function setMode(m){
  var fv=document.getElementById('fvFantasy'),gv=document.getElementById('fvGambling');
  var bf=document.getElementById('mbFV'),bg=document.getElementById('mbGB');
  if(m==='gb'){fv.style.display='none';gv.style.display='block';bf.classList.remove('on');bg.classList.add('on');renderGambling();}
  else{fv.style.display='block';gv.style.display='none';bg.classList.remove('on');bf.classList.add('on');}
}
if(!STANDALONE){
  document.getElementById('mbFV').onclick=function(){setMode('fv');};
  document.getElementById('mbGB').onclick=function(){setMode('gb');};
}
Array.prototype.forEach.call(document.querySelectorAll('#gtabs .tab'),function(t){
  t.onclick=function(){document.querySelectorAll('#gtabs .tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');G.market=t.getAttribute('data-g');G.sort={key:'lean',asc:false};drawMarket();};
});
document.getElementById('gsearch').oninput=function(){G.q=this.value.toLowerCase();drawMarket();};
if(STANDALONE){ renderGambling(); }
else if(dsel) dsel.addEventListener('change',function(){ if(document.getElementById('fvGambling').style.display!=='none') renderGambling(); });
}catch(e){ if(window.console)console.error('gambling module error',e); }
})();

</script></body></html>
