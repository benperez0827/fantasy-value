'<p class="sub">Model-driven prop leans built from the same Statcast + matchup engine as the value model. Each spot is ranked 0&ndash;100 by the metrics that drive that prop. POC v1.</p>'+
'<div class="gnote"><b>How to read this:</b> these are <b>model leans</b>, not odds-derived edges. The engine ranks each spot 0&ndash;100 by the inputs that move that prop (contact quality, matchup vs today&#39;s starter, park, recent form). The <b>Line / Odds / Edge</b> columns show prop lines via <b>SportsGameOdds</b> (FanDuel when available, otherwise market consensus) once an odds key is configured; <b>Edge</b> = model probability &minus; the de-vigged implied probability (positive = model sees value; strikeout edge uses a Poisson model around the posted line). Free-tier lines may be ~10 min delayed. The Hits/TB tab lists odds for <b>1+ hits</b> and <b>2+ total bases</b> &mdash; two different bets &mdash; with an edge beside each (model probabilities are rough estimates: 1+ hits uses the model&#39;s hit probability; 2+ total bases scales it by the batter&#39;s power (SLG)). The <b>Pitcher Props</b> tab covers three starter bets: strikeouts (Over, Poisson around the line &mdash; now adjusted for the <b>opposing lineup&#39;s K%</b> split by the pitcher&#39;s handedness, the lineup&#39;s home/away role, and its last-30-day form), <b>outs recorded</b> (Over, from the model&#39;s projected innings) and <b>earned runs</b> (Under, from expected ERA over projected innings) &mdash; each with its own odds and edge. <b>Ineligible players</b> (IL, bereavement, paternity, or DTD) are excluded from all leans and Top Plays. <b>Limited-role bats</b> (low season plate appearances) are also held out so part-timers don&#39;t surface as plays. <b>Top Plays additionally require an everyday job</b> (&ge;70% of a full-timer&#39;s PA): platoon bats who sit vs same-hand starters or get lifted mid-game stay on the market tabs but are never recommended. Model %/projections are rough estimates, not guarantees. <b>Top Plays</b> are the model&#39;s sweet-spot bets: a strong model lean (&ge;65) AND a positive edge, ranked by a blend of the two and capped at 3 per market. Both overs and unders are considered, but <b>unders only on pitcher props</b> (K/Outs) since FanDuel doesn&#39;t post hitter unders; for an under, &lsquo;conviction&rsquo; is the inverse lean (a pitcher the model strongly fades). Home-run props use a richer power profile (barrels/PA, hard-hit%, exit velo, bat speed, SLG) plus heavy splits weighting &mdash; platoon (vs the starter&#39;s hand), home/away power, ballpark HR-friendliness, and batter-vs-starter history &mdash; and a recalibrated HR-probability curve (convex: elite power ~24-29%, weak ~6-8%) fit so HR edges are no longer systematically negative without inflating weak-hitter longshots. Hit/TB props are likewise calibrated from the backtest: 1+ hit probabilities are deflated (the model was over-confident on favorites, ~80% predicted vs ~67% actual) and 2+ total-base probabilities are boosted (under-rated like HR). All FanDuel-offered markets qualify (earned-run props are excluded since FanDuel doesn&#39;t post them). <b>Top Plays now use FanDuel odds only</b> &mdash; a play is included only when we have FanDuel&#39;s price; if only market consensus is available it&#39;s left out (you can still see it on the market tabs, tagged <b>cons</b>). <b>2026-07-27 recalibration:</b> hitter and HR model probabilities are now also shrunk toward the de-vigged market price (K/Outs already were); Top Plays exclude the mid odds band (-149 to +149, the backtest&#39;s worst-performing prices); Hits/TB and HR picks require a positive blended edge; and pitcher K/Outs plays require a recent-workload check (avg &ge;85 pitches over the last 3 starts, no 15+ day layoff) so post-IL/short-leash starts are never recommended. For entertainment; please bet responsibly.</div>'+

function equitySVG(pts){

  var col=pts[n-1]>=0?'#0d7d4d':'#b3402f';
  return '<div style="background:#fff;border:1px solid #e1e5ea;border-radius:9px;padding:8px 10px;margin-bottom:12px"><div class="mk" style="color:#42505e;margin-bottom:4px">Cumulative units ('+n+' graded bets)</div><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:120px"><line x1="'+pad+'" y1="'+Y(0)+'" x2="'+(w-pad)+'" y2="'+Y(0)+'" stroke="#cdd3da" stroke-dasharray="3 3"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/></svg></div>';
}
